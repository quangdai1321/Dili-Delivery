// ---------- utils ----------
// RNG is swapped for a seeded generator while building daily-challenge maps / orders
let RNG=Math.random;
const mulberry32=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function seeded(seed,fn){if(seed==null)return fn();const prev=RNG;RNG=mulberry32(seed);try{return fn()}finally{RNG=prev}}
const rand=(a,b)=>a+RNG()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(RNG()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, key=(c,r)=>c+','+r, inb=(c,r)=>c>=0&&r>=0&&c<COLS&&r<ROWS;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const mtCache=new Map();

function outlined(s,x,y,size,color,align='center'){

  const q=RSU*Math.max(size>=40?1.15:1.6,Math.pow(1.25,Math.ceil(Math.log(k/RSU)/Math.log(1.25)))),key=s+'|'+size+'|'+color+'|'+q.toFixed(3);let e=txtCache.get(key);

   cv.width=Math.max(1,Math.ceil(w*q));cv.height=Math.max(1,Math.ceil(h*q));const g=cv.getContext('2d');g.scale(q,q);g.font=font(size,900);g.textAlign='left';g.textBaseline='middle';
   g.lineJoin='round';g.lineWidth=5;g.strokeStyle='rgba(5,8,20,.85)';g.strokeText(s,5,h/2);g.fillStyle=color;g.fillText(s,5,h/2);
   e={cv,w,h};txtCache.set(key,e);if(txtCache.size>90)txtCache.delete(txtCache.keys().next().value)}
  ctx.drawImage(e.cv,align==='center'?x-e.w/2:align==='right'?x-e.w+5:x-5,y-e.h/2,e.w,e.h);return}
 ctx.font=font(size,900);ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(5,8,20,.85)';ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y)}

function carRect(k){const l=k.l;

function makeCar(){

 const k={id:++carSeq,l:null,pos:0,len:sc?26:M.len,wid:sc?14:M.wid,sc,model,spd:rand(...zone.carSpd)*(sc?1.5:M.spd),v:0,color:pick(!sc&&M.colors||zone.carColors||CAR_COLORS)};
 for(let tries=0;tries<30;tries++){k.l=pick(lines);k.pos=rand(0,k.l.h?W:ROWS*T);const R=carRect(k);
  if(!player||Math.hypot(R.x+R.w/2-player.x,R.y+R.h/2-player.y)>220)break}
 // road ragers (Night District on): floor it when Dili is ahead in their lane
 k.rage=!sc&&zoneIdx>=1&&RNG()<.18+.04*zoneIdx+.05*loop;k.angry=0;k.honkCd=0;
 k.v=k.spd;return k;
}
function ragerSees(k){ // Dili is in this car's lane, ahead of it and close

}
function spawnCars(){cars=[];if(!lines.length)return;for(let i=0;i<zone.cars;i++)cars.push(makeCar())}
function updateCars(dt){
 const f=(1+Math.min(.5,combo*.03))*diff()*(evOn("rush")?1.3:1);
 for(const k of cars){
  let v=k.spd*f,gap=1e9,ahead=null;
  if(k.rage&&mode==='play'){k.honkCd-=dt;if(ragerSees(k)){if(!k.angry&&k.honkCd<=0){k.honkCd=2.5;const R=carRect(k);sfxAt({x:R.x+R.w/2,y:R.y+R.h/2},SFX.honk)}k.angry=.6}else k.angry=Math.max(0,k.angry-dt);if(k.angry)v*=1.75}
  for(const o of cars){if(o===k||o.l!==k.l)continue;const d=(o.pos-k.pos)*k.l.dir;if(d>0&&d<gap){gap=d;ahead=o}}
  if(ahead&&gap<(k.len+ahead.len)/2+16)v=Math.min(v,ahead.v*.9);
  if(peds.length){const l=k.l,lane=l.h?HUD+l.idx*T+T/2:l.idx*T+T/2; // brake for pedestrians in the lane ahead
   for(const p of peds){if(Math.abs((l.h?p.y:p.x)-lane)>16)continue;const d=((l.h?p.x:p.y-HUD)-k.pos)*l.dir;if(d>0&&d<k.len/2+22){v=0;break}}}
  k.v+=(v-k.v)*Math.min(1,dt*6);k.pos+=k.l.dir*k.v*dt;
  const span=k.l.h?W:ROWS*T;
  if(k.l.dir>0&&k.pos>span+50)k.pos=-50;if(k.l.dir<0&&k.pos<-50)k.pos=span+50;
 }
}

// ---------- physics ----------
function pushOut(p,rx,ry,rw,rh){
 const nx=clamp(p.x,rx,rx+rw),ny=clamp(p.y,ry,ry+rh),dx=p.x-nx,dy=p.y-ny,d2=dx*dx+dy*dy;
 if(d2>=p.r*p.r)return false;
 if(d2>1e-4){const d=Math.sqrt(d2);p.x+=dx/d*(p.r-d);p.y+=dy/d*(p.r-d)}
 else{const l=p.x-rx,r=rx+rw-p.x,t=p.y-ry,b=ry+rh-p.y,m=Math.min(l,r,t,b);
  if(m===l)p.x=rx-p.r;else if(m===r)p.x=rx+rw+p.r;else if(m===t)p.y=ry-p.r;else p.y=ry+rh+p.r}
 return true;
}
const BI=8; // roadwork inset inside its tile
function collideWorld(p){
 for(let it=0;it<2;it++){
  const c0=Math.floor((p.x-p.r)/T),c1=Math.floor((p.x+p.r)/T),r0=Math.floor((p.y-HUD-p.r)/T),r1=Math.floor((p.y-HUD+p.r)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
   if(!inb(c,r)||!grid[r][c])pushOut(p,c*T,HUD+r*T,T,T);
   else if(barriers.has(key(c,r))){
    // in a one-tile corridor, roadworks only push back along the corridor (a sideways push would shove Dili into a wall)
    const vert=!isRoad(c-1,r)&&!isRoad(c+1,r),horz=!isRoad(c,r-1)&&!isRoad(c,r+1),x0=c*T+BI,y0=HUD+r*T+BI,s=T-2*BI;
    if(vert&&circleHitsRect(p,{x:c*T,y:y0,w:T,h:s}))p.y=p.y<y0+s/2?y0-p.r:y0+s+p.r;
    else if(horz&&circleHitsRect(p,{x:x0,y:HUD+r*T,w:s,h:T}))p.x=p.x<x0+s/2?x0-p.r:x0+s+p.r;
    else if(!vert&&!horz)pushOut(p,x0,y0,s,s)}
  }
 }
}
function circleHitsRect(p,R,pad=0){const nx=clamp(p.x,R.x,R.x+R.w),ny=clamp(p.y,R.y,R.y+R.h);return (p.x-nx)**2+(p.y-ny)**2<(p.r+pad)**2}

// lane steering: maps analog / diagonal / early input onto the road grid, so Dili follows lanes,
// takes the turn you are holding toward, and never grinds against building corners
function steer(P,inp){
 const m=Math.min(1,Math.hypot(inp.x,inp.y));if(m<.1)return{x:0,y:0};
 const t=tileOf(P);if(!walkable(t.c,t.r))return inp;
 const c=center(t.c,t.r),sx=Math.sign(inp.x),sy=Math.sign(inp.y);
 const openX=Math.abs(inp.x)>.25&&walkable(t.c+sx,t.r),openY=Math.abs(inp.y)>.25&&walkable(t.c,t.r+sy);
 const alongX=s=>({x:s*m,y:clamp((c.y-P.y)*.08,-.6,.6)}),alongY=s=>({x:clamp((c.x-P.x)*.08,-.6,.6),y:s*m});
 // decisions stick for as long as Dili stays on this tile with the same held direction: deciding from the current
 // velocity every frame made a held diagonal flip between "turn" and "go straight" and Dili shook in place at corners
 const mk=t.c+','+t.r+'|'+sx+','+sy;if(P.stKey!==mk){P.stKey=mk;P.stAxis=null;P.stSlide=0}
 let ax=Math.abs(inp.x)>=Math.abs(inp.y)?'x':'y';
 if(openX&&openY&&Math.abs(Math.abs(inp.x)-Math.abs(inp.y))<.35){if(!P.stAxis)P.stAxis=Math.abs(P.vx)>Math.abs(P.vy)?'y':'x';ax=P.stAxis} // held diagonal = take the turn
 else if(ax==='x'&&!openX&&openY)ax='y';else if(ax==='y'&&!openY&&openX)ax='x';
 else if(!openX&&!openY){ // pressing into a wall: slide to the nearest opening in that direction (turn buffer)
  const want=Math.abs(inp.y)>=Math.abs(inp.x)?'y':'x';
  if(want==='y'&&sy){const f=P.stSlide||Math.sign(P.vx)||1;for(let d=1;d<=3;d++)for(const s of[f,-f]){let ok=true;for(let i=1;i<=d;i++)if(!walkable(t.c+s*i,t.r))ok=false;if(ok&&walkable(t.c+s*d,t.r+sy)){P.stSlide=s;return alongX(s)}}}
  if(want==='x'&&sx){const f=P.stSlide||Math.sign(P.vy)||1;for(let d=1;d<=3;d++)for(const s of[f,-f]){let ok=true;for(let i=1;i<=d;i++)if(!walkable(t.c,t.r+s*i))ok=false;if(ok&&walkable(t.c+sx,t.r+s*d)){P.stSlide=s;return alongY(s)}}}
  return inp;
 }
 // turning: finish lining up with the lane first so the corner can't snag
 const tol=zone.ice?16:10; // on ice Dili slides past the lane centre, so accept a looser line-up before turning
 if(ax==='y'&&openY&&Math.abs(c.x-P.x)>tol)return alongX(Math.sign(c.x-P.x));
 if(ax==='x'&&openX&&Math.abs(c.y-P.y)>tol)return alongY(Math.sign(c.y-P.y));
 return ax==='x'?alongX(sx||1):alongY(sy||1);
}

{const c=(new URLSearchParams(location.search).get('coop')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(c.length>=4)coopOpen(c)}
let last=performance.now(),perfAcc=0,perfN=0,goodT=0,badN=0,lastScale=0,fpsVal=60,inMenuHQ=false,playRes=null;
// smooth screen changes: the last frame of the old screen fades out over the new one
const transCv=document.createElement('canvas'),transCtx=transCv.getContext('2d');let transT=0,lastMode=null;
const TRANS=.25,noTrans=(a,b)=>a==='splash'||(a==='play'&&b==='stage')||(a==='stage'&&b==='play');
// snapshot the old screen when the mode changes: at the top of the frame (input changed it, before any resize

function checkTrans(){if(mode===lastMode)return;if(lastMode&&!noTrans(lastMode,mode)&&canvas.width){transCv.width=canvas.width;transCv.height=canvas.height;transCtx.drawImage(canvas,0,0);transT=TRANS}lastMode=mode}
function drawUiFx(dt){
 if(uiPress){uiPress.t-=dt;if(uiPress.t<=0)uiPress=null;else{const u=1-uiPress.t/.35,g=u*10;ctx.save();ctx.setTransform(RSU,0,0,RSU,RSU*UX,0);
  ctx.strokeStyle=`rgba(191,224,255,${(1-u)*.7})`;ctx.lineWidth=2.5;rr(ctx,uiPress.x-g,uiPress.y-g,uiPress.w+g*2,uiPress.h+g*2,(uiPress.h+g*2)/2);ctx.stroke();ctx.restore()}}
 if(transT>0){transT-=dt;const a=Math.max(0,transT/TRANS);ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=a*a;ctx.drawImage(transCv,0,0,canvas.width,canvas.height);ctx.restore()}
}
function frame(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;checkTrans();
 // adaptive resolution: every 1.5s look at the average frame time; below ~50fps render fewer pixels,
 // after 6s of solid 60fps try a little more. Phones heat up and slow down over a session, so this keeps adjusting.
 fpsVal+=(1/Math.max(dt,1e-3)-fpsVal)*.05;
 // menus are light: always show them at full sharpness, and give a run back the resolution it had settled on
 if(mode==='menu'&&glyphWarm!==RSU&&runT>1.2)warmGlyphs(); // once per UI resolution, while nothing else is going on
 {const menuish=mode==='menu'||mode==='splash'||mode==='board'||mode==='shop'||mode==='missions'||mode==='coop'||mode==='settings'&&settingsFrom==='menu';
  if(menuish!==inMenuHQ){inMenuHQ=menuish;
   if(menuish){playRes={resCap,uiLow};uiLow=false;resCap=gfxMax();resize()}
   else{if(playRes){resCap=Math.min(gfxMax(),playRes.resCap);uiLow=playRes.uiLow}resize()}}
  if(menuish){perfAcc=0;perfN=0;if(uiLow||resCap<gfxMax()){if(!playRes)playRes={resCap,uiLow};uiLow=false;resCap=gfxMax();resize()}}}
 if(!document.hidden&&settings.gfx!=='high'&&!inMenuHQ){perfAcc+=dt;perfN++;
  if(perfAcc>=2){const avg=perfAcc/perfN,calm=now-lastScale>4000;perfAcc=0;perfN=0;
   if(avg>1/50){goodT=0;if(++badN>=2&&calm){badN=0;
    if(resCap>.6){resCap=Math.max(.6,resCap*.8);lastScale=now;resize()}else if(!uiLow){uiLow=true;lastScale=now;resize()}}}
   else{badN=0;if(avg<1/57)goodT+=2;else goodT=0;
    if(goodT>=8&&calm&&!uiLow&&resCap<gfxMax()&&!midRun()){resCap=Math.min(gfxMax(),resCap*1.15);goodT=0;lastScale=now;resize()}}}}
 // sub-step long frames so game speed stays real-time on slow devices
 if(mode==='play'&&!document.hidden){frameHist[Math.min(100,Math.round(dt*1000))]++;frameN++;frameSum+=dt}
 const n=Math.ceil(dt/.033);for(let i=0;i<n;i++)update(dt/n);
 checkTrans();coopTick(dt);draw();drawUiFx(dt);if(momentPend&&(mode==='play'||mode==='stage')&&(momentPend.t-=dt)<=0)captureMoment();requestAnimationFrame(frame);
}
