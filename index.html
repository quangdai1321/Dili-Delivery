function ensureAudio(){
 if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{actx=new AC();master=actx.createGain();master.gain.value=.5;master.connect(actx.destination);
   music.gain=actx.createGain();music.gain.gain.value=0;music.gain.connect(master);music.next=actx.currentTime+.1;setInterval(musicTick,25)}
  catch(e){actx=null;return}}
 if(actx.state==='suspended')actx.resume();
}
function getNoise(){if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate*.5,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function tone(f,d,type='square',v=.1,slide=1,delay=0){
 if(!actx||muted)return;const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide!==1)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g).connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,v=.2,freq=900,delay=0,type='lowpass',dest){
 if(!actx||muted)return;const t=actx.currentTime+delay,s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
 s.buffer=getNoise();f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(f).connect(g).connect(dest||master);s.start(t);s.stop(t+d+.02);
}

const mtof=m=>440*Math.pow(2,(m-69)/12);
// 4-bar chord loops (midi), one per screen/zone
const TRACKS={
 menu:{bpm:92,prog:[[48,52,55,59],[45,48,52,55],[41,45,48,52],[43,47,50,55]],drums:0,arp:'triangle',bass:'sine',pad:true},
 0:{bpm:116,prog:[[48,52,55,60],[43,47,50,55],[45,48,52,57],[41,45,48,53]],drums:1,arp:'square',bass:'triangle'},
 1:{bpm:100,prog:[[45,48,52,55],[41,45,48,52],[48,52,55,59],[43,47,50,55]],drums:1,arp:'triangle',bass:'triangle',pad:true},
 2:{bpm:136,prog:[[40,43,47,52],[36,40,43,48],[43,47,50,55],[38,42,45,50]],drums:2,arp:'sawtooth',bass:'sawtooth'},
 3:{bpm:118,prog:[[43,47,50,55],[38,42,45,50],[40,43,47,52],[36,40,43,48]],drums:1,arp:'square',bass:'triangle'},
 4:{bpm:104,prog:[[41,45,48,53],[45,48,52,57],[46,50,53,58],[48,52,55,60]],drums:1,arp:'sine',bass:'sine',pad:true,oct:24},
 5:{bpm:124,prog:[[38,41,45,50],[34,38,41,46],[41,45,48,53],[36,40,43,48]],drums:2,arp:'square',bass:'sawtooth',pad:true},
};
function mNote(t,m,d,type,v){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(mtof(m),t);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(music.gain);o.start(t);o.stop(t+d+.02)}
function mKick(t){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
 g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(music.gain);o.start(t);o.stop(t+.18)}
function mNoise(t,d,v,freq,type){const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();s.buffer=getNoise();f.type=type;f.frequency.value=freq;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(music.gain);s.start(t,Math.random()*.3);s.stop(t+d+.02)}
function playStep(tr,step,t,spb){
 const s=step%16,ch=tr.prog[Math.floor(step/16)%tr.prog.length],root=ch[0];
 const inten=mode==='play'?(combo>=8?2:combo>=3?1:0):0;
 if(tr.pad&&s===0)ch.forEach(m=>mNote(t,m+12,spb*15,'sine',.028));
 const bass=tr.drums===2?s%2===0:tr.drums?[0,3,8,11].includes(s):s===0||s===8;
 if(bass)mNote(t,root-12,spb*(tr.drums===2?1.6:2.4),tr.bass,tr.drums===2?.08:.13);
 const every=inten>=1||tr.drums===2?1:2;
 if(s%every===0){const i=(s/every)%4;mNote(t,ch[i]+(tr.oct||12)+(inten>=2&&s%4===2?12:0),spb*(tr.arp==='sine'?2:.9),tr.arp,{triangle:.045,sine:.05}[tr.arp]||.022)}
 const MOT=[0,3,6,10,12],mi=MOT.indexOf(s);
 if(inten>=1&&mi>=0)mNote(t,ch[[2,1,3,1,0][mi]]+24,spb*1.6,'triangle',.04);
 if(tr.drums){
  if(s===0||s===8||(tr.drums===2&&(s===4||s===12))||(inten>=2&&s===10))mKick(t);
  if(s===4||s===12)mNoise(t,.14,.2,1800,'bandpass');
  if(s%4===2||((inten>=2||tr.drums===2)&&s%2===1))mNoise(t,.04,.06,7000,'highpass');
 }
}
function musicTick(){
 if(!actx||!music.gain)return;
 const now=actx.currentTime;if(music.next<now-.1)music.next=now+.05;
 const want=mode==='menu'?'menu':String(zoneIdx);
 while(music.next<now+.12){
  if(music.step%4===0&&music.track!==want){music.track=want;music.step=0}
  const tr=TRACKS[music.track],spb=60/(tr.bpm*(mode==='play'?1+Math.min(.12,combo*.01)+loop*.03:1))/4;
  if(!muted)playStep(tr,music.step,music.next,spb);
  music.next+=spb;music.step++;
 }
 const vol=muted?0:mode==='play'||mode==='stage'?.32:mode==='menu'?.3:mode==='over'?.12:.14;
 if(vol!==music.vol){music.vol=vol;music.gain.gain.setTargetAtTime(vol,now,.2)}
}

// ---------- map generation ----------
function bfs(sc,sr){
 const dist=new Int16Array(COLS*ROWS).fill(-1),prev=new Int16Array(COLS*ROWS).fill(-1),q=[sr*COLS+sc];dist[q[0]]=0;
 for(let h=0;h<q.length;h++){const i=q[h],c=i%COLS,r=(i/COLS)|0;
  for(const[dc,dr]of DIRS){const nc=c+dc,nr=r+dr;if(!walkable(nc,nr))continue;const j=nr*COLS+nc;if(dist[j]>=0)continue;dist[j]=dist[i]+1;prev[j]=i;q.push(j)}}
 return{dist,prev};
}
function connected(){
 let total=0,start=null;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(walkable(c,r)){total++;if(!start)start=[c,r]}
 if(!start)return false;const{dist}=bfs(start[0],start[1]);let n=0;for(const d of dist)if(d>=0)n++;return n===total;
}

function updateCars(dt){

  let v=k.spd*f,gap=1e9,ahead=null;

// ---------- physics ----------
function pushOut(p,rx,ry,rw,rh){
 const nx=clamp(p.x,rx,rx+rw),ny=clamp(p.y,ry,ry+rh),dx=p.x-nx,dy=p.y-ny,d2=dx*dx+dy*dy;
 if(d2>=p.r*p.r)return false;
 if(d2>1e-4){const d=Math.sqrt(d2);p.x+=dx/d*(p.r-d);p.y+=dy/d*(p.r-d)}
 else{const l=p.x-rx,r=rx+rw-p.x,t=p.y-ry,b=ry+rh-p.y,m=Math.min(l,r,t,b);
  if(m===l)p.x=rx-p.r;else if(m===r)p.x=rx+rw+p.r;else if(m===t)p.y=ry-p.r;else p.y=ry+rh+p.r}
 return true;
}
const BI=8; // roadwork inset inside its tile
function collideWorld(p){
 for(let it=0;it<2;it++){
  const c0=Math.floor((p.x-p.r)/T),c1=Math.floor((p.x+p.r)/T),r0=Math.floor((p.y-HUD-p.r)/T),r1=Math.floor((p.y-HUD+p.r)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
   if(!inb(c,r)||!grid[r][c])pushOut(p,c*T,HUD+r*T,T,T);
   else if(barriers.has(key(c,r)))pushOut(p,c*T+BI,HUD+r*T+BI,T-2*BI,T-2*BI);
  }
 }
}
function circleHitsRect(p,R,pad=0){const nx=clamp(p.x,R.x,R.x+R.w),ny=clamp(p.y,R.y,R.y+R.h);return (p.x-nx)**2+(p.y-ny)**2<(p.r+pad)**2}

// ---------- input ----------
const keys=new Set();
function inputVec(){
 let x=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0);
 let y=(keys.has('ArrowDown')||keys.has('KeyS')?1:0)-(keys.has('ArrowUp')||keys.has('KeyW')?1:0);
 if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>9){const m=Math.min(1,l/55);x=dx/l*m;y=dy/l*m}}
 const l=Math.hypot(x,y);return l>1?{x:x/l,y:y/l}:{x,y};
}
addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 keys.add(e.code);if(e.repeat)return;ensureAudio();
 const go=e.code==='Enter'||e.code==='Space';
 if(e.code==='KeyM'){toggleMute();return}
 if(mode==='menu'){if(go)startRun()}
 else if(mode==='over'){if((go||e.code==='KeyR')&&overDelay<=0)startRun()}
 else if(mode==='paused'){if(go||e.code==='KeyP'||e.code==='Escape')mode='play'}
 else if(mode==='stage'){if(go&&stageT>1.2&&stageT<2.7)stageT=2.7}
 else if(mode==='upgrade'){const i=['Digit1','Digit2','Digit3','Numpad1','Numpad2','Numpad3'].indexOf(e.code);if(i>=0)chooseUpgrade(i%3)}
 else if(mode==='play'){
  if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight')tryDash();
  else if(e.code==='KeyP'||e.code==='Escape')mode='paused';
  else if(e.code==='KeyR')startRun();
 }
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{keys.clear();joy=null;if(mode==='play')mode='paused'});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')mode='paused'});
function toCanvas(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
const hit=(p,b)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();ensureAudio();const p=toCanvas(e);if(e.pointerType==='touch')touchUI=true;
 const b=buttons.find(b=>hit(p,b));if(b){b.act();return}
 if(mode==='menu'){startRun();return}
 if(mode==='over'){if(overDelay<=0)startRun();return}
 if(mode==='paused'){mode='play';return}
 if(mode==='stage'){if(stageT>1.2&&stageT<2.7)stageT=2.7;return}
 if(mode!=='play')return;
 if(p.y<HUD&&p.x>W-44){toggleMute();return}
 if(e.pointerType!=='mouse'&&p.x>W*.62){tryDash();return}
 joy={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y};try{canvas.setPointerCapture(e.pointerId)}catch(err){}
});
canvas.addEventListener('pointermove',e=>{const p=toCanvas(e);mouse=p;if(joy&&e.pointerId===joy.id){joy.x=p.x;joy.y=p.y}});
const endJoy=e=>{if(joy&&e.pointerId===joy.id)joy=null};
canvas.addEventListener('pointerup',endJoy);canvas.addEventListener('pointercancel',endJoy);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// ---------- particles ----------
function burst(x,y,n,colors,confetti){
 for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(80,confetti?330:240);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(confetti?120:0),t:rand(.45,.9),max:.9,size:rand(3,6),color:pick(colors),g:confetti?420:0,rot:rand(0,6)})}
}
function dust(x,y){particles.push({x:x+rand(-4,4),y:y+rand(-2,4),vx:rand(-15,15),vy:rand(-25,-5),t:.45,max:.45,size:rand(4,7),color:zone.dark>.5?'rgba(150,170,220,.5)':'rgba(230,235,245,.7)',g:0,dust:true})}
function flame(x,y,hot){particles.push({x:x+rand(-7,7),y:y+rand(-4,8),vx:rand(-10,10),vy:rand(-70,-40),t:rand(.3,.5),max:.5,size:rand(4,7),color:pick(hot?['#ffd34d','#ff8a2a','#fff3b0']:['#6fa3ff','#8fd0ff','#ffffff']),g:0,dust:true,glow:true})}

// ---------- update ----------
function update(dt){
 runT+=dt;overDelay=Math.max(0,overDelay-dt);shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*1.6);
 comboPulse=Math.max(0,comboPulse-dt);scorePulse=Math.max(0,scorePulse-dt);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.97;if(!p.g)p.vy*=.97;p.t-=dt;p.rot=(p.rot||0)+dt*8}
 particles=particles.filter(p=>p.t>0);
 for(const f of floats){f.y-=34*dt;f.t-=dt}floats=floats.filter(f=>f.t>0);
 for(const r of rings)r.t-=dt;rings=rings.filter(r=>r.t>0);
 for(const d of rain){d.y+=d.s*dt;d.x-=d.s*.18*dt;if(d.y>H){d.y=HUD-10;d.x=rand(0,W+120)}}
 for(const a of ambient){
  if(a.gull){a.x+=a.vx*dt;a.p+=dt*9;if(a.x>W+40)a.x=-40;if(a.x<-40)a.x=W+40}
  else if(zone.clouds){a.x+=a.s*dt;if(a.x-a.rx>W)a.x=-a.rx}
  else{a.x+=a.vx*dt;a.y+=a.vy*dt;a.p+=dt*3;if(Math.random()<dt*.5){a.vx=rand(-14,14);a.vy=rand(-14,14)}if(a.x<0||a.x>W)a.vx*=-1;if(a.y<HUD||a.y>H)a.vy*=-1}
 }
 if(zone.rain&&mode!=='menu')for(let i=0;i<3;i++)splashes.push({x:rand(0,W),y:rand(HUD,H),t:.3});
 for(const f of snowflakes){f.y+=f.s*dt;f.x+=Math.sin(runT*1.5+f.p)*20*dt;if(f.y>H){f.y=HUD-5;f.x=rand(0,W)}}
 for(const s of splashes)s.t-=dt;splashes=splashes.filter(s=>s.t>0);
 dispScore+=(score-dispScore)*Math.min(1,dt*7);if(Math.abs(score-dispScore)<1)dispScore=score;
 if(mode==='menu'){updateCars(dt);return}
 if(mode==='stage'){stageT+=dt;
  if(pendingZone&&stageT>=.5){const pz=pendingZone;pendingZone=null;enterZone(pz.i,false,pz.loop);newOrder()}
  if(stageT>=3.2){mode='play';if(pendingUpgrade){pendingUpgrade=false;openUpgrade()}}return}
 if(mode!=='play')return;
 if(hitStop>0){hitStop-=dt;return}
 // coins fly from the drop point to the score counter
 for(const c of coins){c.t+=dt;if(c.t>=c.dur){c.done=true;scorePulse=.25;SFX.coin(c.i)}}coins=coins.filter(c=>!c.done);
 if(zone.rain){lightningT-=dt;if(lightningT<=0){lightningT=rand(5,10);flash=.45;flashColor='#dfe8ff';SFX.thunder()}}
 if(resultCard&&(resultCard.t-=dt)<=0)resultCard=null;
 if(banner&&(banner.t-=dt)<=0)banner=null;
 if(hype&&(hype.t-=dt)<=0)hype=null;

 shiftTime-=dt;
 if(shiftTime<10){const s=Math.ceil(shiftTime);if(s<lastTickSec){lastTickSec=s;SFX.tick()}}
 if(shiftTime<=0){shiftTime=0;endRun();return}

 const P=player;P.inv=Math.max(0,P.inv-dt);P.dash=Math.max(0,P.dash-dt);P.dashCd=Math.max(0,P.dashCd-dt);P.pop=Math.max(0,P.pop-dt);P.dizzy=Math.max(0,P.dizzy-dt);
 const inp=inputVec(),spd=playerSpeed();
 if(P.dash>0){P.vx=P.dashDir.x*spd*2.3;P.vy=P.dashDir.y*spd*2.3;P.trail.push({x:P.x,y:P.y,t:.22})}
 else{const k=Math.min(1,dt*(zone.ice?2.4:zone.lowgrav?4.5:12));P.vx+=(inp.x*spd-P.vx)*k;P.vy+=(inp.y*spd-P.vy)*k}
 for(const g of P.trail)g.t-=dt;P.trail=P.trail.filter(g=>g.t>0);
 // corner assist: glide toward the lane centre when turning into an open road
 const t=tileOf(P);
 if(Math.abs(inp.x)>.5&&Math.abs(inp.y)<.35&&walkable(t.c+Math.sign(inp.x),t.r)){const cy=center(t.c,t.r).y;P.y+=clamp(cy-P.y,-140*dt,140*dt)}
 if(Math.abs(inp.y)>.5&&Math.abs(inp.x)<.35&&walkable(t.c,t.r+Math.sign(inp.y))){const cx=center(t.c,t.r).x;P.x+=clamp(cx-P.x,-140*dt,140*dt)}
 const ox=P.x,oy=P.y;
 P.x+=P.vx*dt;collideWorld(P);P.y+=P.vy*dt;collideWorld(P);
 const moved=Math.hypot(P.x-ox,P.y-oy);P.moving=moved>40*dt;
 if(Math.abs(P.vx)>20)P.face=Math.sign(P.vx);
 if(P.moving&&(P.dustT-=dt)<=0){P.dustT=.07;dust(P.x,P.y+14)}
 if(combo>=5&&Math.random()<dt*(combo>=10?40:22))flame(P.x,P.y,combo>=10);
 if(order.carrying){order.clock+=dt;order.dist+=moved}

 updateCars(dt);
 if(P.inv<=0){
  for(const k of cars){const R=carRect(k);if(circleHitsRect(P,{x:R.x+3,y:R.y+3,w:R.w-6,h:R.h-6})){crash(R.x+R.w/2,R.y+R.h/2);break}}
 }
 for(const tr of trains){tr.t-=dt;const ry=HUD+tr.row*T+T/2;
  if(tr.state==='idle'&&tr.t<=0){tr.state='warn';tr.t=1.5;tr.dir=Math.random()<.5?1:-1;tr.ding=0;
   if(Math.abs(P.y-ry)<T*2.5)floats.push({x:P.x,y:P.y-36,text:'⚠ TRAIN!',color:'#ff6473',t:1,max:1,size:18})}
  else if(tr.state==='warn'){if((tr.ding-=dt)<=0){tr.ding=.35;SFX.bell()}
   if(tr.t<=0){tr.state='pass';tr.len=ri(4,6)*58+70;tr.x=tr.dir>0?-10:W+10;SFX.horn()}}
  else if(tr.state==='pass'){tr.x+=tr.dir*720*diff()*dt;
   if(tr.dir>0?tr.x-tr.len>W+10:tr.x+tr.len<-10){tr.state='idle';tr.t=rand(3,5.5)/diff()}
   const R=tr.dir>0?{x:tr.x-tr.len,y:ry-17,w:tr.len,h:34}:{x:tr.x,y:ry-17,w:tr.len,h:34};
   if(P.inv<=0&&circleHitsRect(P,R)){crash(P.x,ry+(P.y<ry?30:-30));player.vy*=1.4}}
 }
 if(zone.meteors){
  if((meteorT-=dt)<=0){meteorT=rand(1.2,2.1)/diff();let x,y;
   if(Math.random()<.5){x=P.x+P.vx*.9;y=P.y+P.vy*.9}else{const tt=tileOf(P),cc=center(clamp(tt.c+ri(-6,6),0,COLS-1),clamp(tt.r+ri(-4,4),0,ROWS-1));x=cc.x;y=cc.y}
   meteors.push({x:clamp(x,20,W-20),y:clamp(y,HUD+20,H-20),t:0,max:1.35,r:34});SFX.whoosh()}
  for(const m of meteors){m.t+=dt;if(m.t>=m.max){m.hit=true;burst(m.x,m.y,30,['#ff8a2a','#ffd34d','#fff','#8a7ca8']);
   rings.push({x:m.x,y:m.y,t:.5,max:.5,r0:10,r1:m.r*1.6,color:'#ff8a2a'});shake=Math.max(shake,.22);SFX.boom();scorches.push({x:m.x,y:m.y,t:4});
   if(P.inv<=0&&Math.hypot(P.x-m.x,P.y-m.y)<m.r+P.r*.4)crash(m.x,m.y)}}
  meteors=meteors.filter(m=>!m.hit);
 }
 for(const s of scorches)s.t-=dt;scorches=scorches.filter(s=>s.t>0);
 let touching=null;
 for(const b of barriers){const[bc,br]=b.split(',').map(Number),R={x:bc*T+BI,y:HUD+br*T+BI,w:T-2*BI,h:T-2*BI};if(circleHitsRect(P,R,2)){touching=R;break}}
 if(touching&&!P.touching){if(P.inv<=0)crash(touching.x+touching.w/2,touching.y+touching.h/2);else SFX.bump()}
 P.touching=!!touching;

 const tgt=order.carrying?order.drop:order.pickup;
 if(Math.hypot(P.x-tgt.x,P.y-tgt.y)<pickRadius()){if(order.carrying)doDeliver();else doPickup()}
 if(mode==='play'&&(pathTimer-=dt)<=0){pathTimer=.15;computePath()}
}
function computePath(){
 const s=tileOf(player),tg=order.carrying?order.drop:order.pickup,{dist,prev}=bfs(s.c,s.r);
 pathCache=[];let i=tg.r*COLS+tg.c;if(dist[i]<0)return;
 while(i>=0){pathCache.push({c:i%COLS,r:(i/COLS)|0});i=prev[i]}
 pathCache.reverse();
}

// ---------- draw: world ----------
function drawStar(x,y,r,fill){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function drawPackage(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='#c98a3f';rr(ctx,-11,-9,22,18,3);ctx.fill();ctx.fillStyle='#e0a656';rr(ctx,-11,-9,22,6,3);ctx.fill();
 ctx.fillStyle=BRAND.blue;ctx.fillRect(-2.5,-9,5,18);ctx.restore();
}
function drawAwning(bld,road,colors){
 if(!bld)return;const x=bld.c*T,y=HUD+bld.r*T,dx=road.c-bld.c,dy=road.r-bld.r;
 let R=dx===1?{x:x+T-13,y:y+8,w:9,h:T-16}:dx===-1?{x:x+4,y:y+8,w:9,h:T-16}:dy===1?{x:x+8,y:y+T-13,w:T-16,h:9}:{x:x+8,y:y+4,w:T-16,h:9};
 const n=4;for(let i=0;i<n;i++){ctx.fillStyle=colors[i%2];
  if(R.w<R.h)ctx.fillRect(R.x,R.y+i*R.h/n,R.w,R.h/n);else ctx.fillRect(R.x+i*R.w/n,R.y,R.w/n,R.h)}
}
function drawTarget(tg,kind){
 const pulse=Math.sin(runT*6),col=kind==='pickup'?'#ffd34d':'#45e6a5';
 const age=runT-(order.born||0),appear=kind==='pickup'?easeOutBack(Math.min(1,age/.35)):1;
 ctx.save();ctx.globalCompositeOperation='lighter';
 const gr=ctx.createRadialGradient(tg.x,tg.y,4,tg.x,tg.y,54);gr.addColorStop(0,kind==='pickup'?'rgba(255,211,77,.45)':'rgba(69,230,165,.45)');gr.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=gr;ctx.fillRect(tg.x-54,tg.y-54,108,108);ctx.restore();
 ctx.save();ctx.translate(tg.x,tg.y);ctx.scale(appear,appear);ctx.translate(-tg.x,-tg.y);
 ctx.strokeStyle=col;ctx.lineWidth=3;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(tg.x,tg.y,pickRadius()+pulse*3,0,7);ctx.stroke();
 ctx.setLineDash([6,8]);ctx.lineDashOffset=-runT*30;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(tg.x,tg.y,pickRadius()+10,0,7);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
 const by=tg.y-6+pulse*3;
 if(kind==='pickup')drawPackage(tg.x,by,1.05);
 else{ctx.fillStyle=col;ctx.beginPath();ctx.arc(tg.x,by-6,13,Math.PI,0);ctx.lineTo(tg.x,by+14);ctx.closePath();ctx.fill();
  ctx.fillStyle='#0d2a22';ctx.beginPath();ctx.moveTo(tg.x-7,by-4);ctx.lineTo(tg.x,by-11);ctx.lineTo(tg.x+7,by-4);ctx.lineTo(tg.x+5,by-4);ctx.lineTo(tg.x+5,by+2);ctx.lineTo(tg.x-5,by+2);ctx.lineTo(tg.x-5,by-4);ctx.closePath();ctx.fill()}
 const label=kind==='pickup'?'PICK UP':'DROP';ctx.font=font(11,900);const w=ctx.measureText(label).width+14;
 ctx.fillStyle=col;rr(ctx,tg.x-w/2,tg.y-44,w,17,8);ctx.fill();text(label,tg.x,tg.y-35.5,11,'#10182d','center',900);
 ctx.restore();
}
function drawPath(){
 if(pathCache.length<2)return;const col=order.carrying?'#45e6a5':'#ffd34d';
 const pts=[{x:player.x,y:player.y},...pathCache.slice(1).map(t=>center(t.c,t.r))];
 ctx.fillStyle=col;let acc=(runT*60)%16,n=0;
 for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],len=Math.hypot(b.x-a.x,b.y-a.y);
  for(;acc<len;acc+=16){const f=acc/len;ctx.globalAlpha=.3+.35*(.5+.5*Math.sin(runT*8-n++*.6));ctx.beginPath();ctx.arc(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f,3,0,7);ctx.fill()}
  acc-=len}
 ctx.globalAlpha=1;
}
function drawBarrier(c,r){
 const p=center(c,r),horiz=isRoad(c-1,r)&&isRoad(c+1,r);
 if(zone.style==='snow'){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(2,15,16,5,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.strokeStyle='#9fb3c8';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,6,11,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-8,8,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1b2440';ctx.fillRect(-4,-11,2,2);ctx.fillRect(2,-11,2,2);ctx.fillStyle='#ff8a2a';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(8,-7);ctx.lineTo(0,-5.5);ctx.fill();
  ctx.fillStyle='#ef5968';ctx.fillRect(-8,-2,16,3);ctx.fillRect(3,-2,3,8);ctx.restore();return}
 if(zone.style==='moon'){ctx.save();ctx.translate(p.x,p.y);if(!horiz)ctx.rotate(Math.PI/2);
  ctx.strokeStyle=`rgba(53,232,255,${.55+.4*Math.sin(runT*20+c)})`;ctx.lineWidth=4;ctx.shadowColor='#35e8ff';ctx.shadowBlur=14;
  ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(15,0);ctx.moveTo(-15,-6);ctx.lineTo(15,6);ctx.stroke();ctx.shadowBlur=0;
  for(const s of[-1,1]){ctx.fillStyle='#cfd8ea';ctx.beginPath();ctx.arc(s*17,0,6,0,7);ctx.fill();ctx.fillStyle='#35e8ff';ctx.beginPath();ctx.arc(s*17,0,2.5,0,7);ctx.fill()}
  ctx.restore();return}
 ctx.save();ctx.translate(p.x,p.y);if(!horiz)ctx.rotate(Math.PI/2);
 ctx.fillStyle='rgba(0,0,0,.3)';rr(ctx,-16,-5,34,14,3);ctx.fill();
 ctx.fillStyle='#ff8a2a';rr(ctx,-17,-7,34,13,3);ctx.fill();
 ctx.save();rr(ctx,-17,-7,34,13,3);ctx.clip();ctx.fillStyle='#fff';for(let i=-3;i<5;i++){ctx.beginPath();ctx.moveTo(-17+i*9,6);ctx.lineTo(-11+i*9,-7);ctx.lineTo(-7+i*9,-7);ctx.lineTo(-13+i*9,6);ctx.fill()}ctx.restore();
 for(const s of[-1,1]){ctx.fillStyle='#ff6a1a';ctx.beginPath();ctx.moveTo(s*21-5,18);ctx.lineTo(s*21,6);ctx.lineTo(s*21+5,18);ctx.fill()}
 if(Math.sin(runT*8+c)>0){ctx.fillStyle='#ffe066';ctx.shadowColor='#ffe066';ctx.shadowBlur=zone.dark>0?12:4;ctx.beginPath();ctx.arc(0,-10,3,0,7);ctx.fill();ctx.shadowBlur=0}
 ctx.restore();
}
function carTransform(k){const R=carRect(k);ctx.translate(R.x+R.w/2,R.y+R.h/2);ctx.rotate(k.l.h?(k.l.dir>0?0:Math.PI):(k.l.dir>0?Math.PI/2:-Math.PI/2))}
function drawCar(k){
 const L=k.len,Wd=k.wid;ctx.save();carTransform(k);

 ctx.fillStyle='rgba(6,10,24,.6)';ctx.fillRect(0,y-46,W,92);
 ctx.fillStyle=zone.accent;ctx.fillRect(0,y-46,W*Math.min(1,age/.3),2);ctx.fillRect(W-W*Math.min(1,age/.3),y+44,W,2);
 outlined(banner.text,W/2+(1-Math.min(1,age/.25))*-80,y-8,44,zone.accent);text(banner.sub,W/2,y+28,15,'#dfe5f0','center',700);
 ctx.restore();
}
function drawHype(){
 if(!hype)return;const age=hype.max-hype.t,a=Math.min(1,hype.t/.3),s=easeOutBack(Math.min(1,age/.3));
 ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H/2+70);ctx.rotate(Math.sin(age*10)*.04*(1-Math.min(1,age)));ctx.scale(s,s);
 outlined(hype.text,0,0,54,combo>=10?'#ffd34d':zone.accent);outlined(hype.sub,0,40,20,'#fff');ctx.restore();
}
function drawVignette(){
 if(mode!=='play'||shiftTime>=10)return;
 const a=.22+.14*Math.sin(runT*8),g=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.9);
 g.addColorStop(0,'rgba(255,40,60,0)');g.addColorStop(1,`rgba(255,40,60,${a})`);ctx.fillStyle=g;ctx.fillRect(0,HUD,W,ROWS*T);
}
function drawTutorial(){
 if(best.runs>0||deliveries>1||mode!=='play')return;
 const msg=order.carrying?'Follow the green dots to the 🏠 — dodge the cars!':'Follow the yellow dots to pick up the 📦';
 ctx.font=font(15,800);const w=ctx.measureText(msg).width+32;ctx.fillStyle='rgba(8,12,28,.85)';rr(ctx,W/2-w/2,H-44,w,32,16);ctx.fill();
 text(msg,W/2,H-28,15,'#fff','center',800);
}
function drawTouch(){
 if(!touchUI||mode!=='play')return;
 if(joy){ctx.globalAlpha=.25;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.ox,joy.oy,55,0,7);ctx.fill();ctx.globalAlpha=.6;
  const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy),m=Math.min(l,55)/(l||1);ctx.beginPath();ctx.arc(joy.ox+dx*m,joy.oy+dy*m,24,0,7);ctx.fill();ctx.globalAlpha=1}
 const cx=W-86,cy=H-86,cd=player.dashCd/dashCooldown();
 ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(cx,cy,48,0,7);ctx.fill();
 ctx.strokeStyle=cd>0?'rgba(255,255,255,.25)':'#6fd3ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,48,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-cd));ctx.stroke();
 text('⚡',cx,cy-6,24,'#fff','center');text('DASH',cx,cy+20,11,'#fff','center',900);
}
function button(label,x,y,w,h,act,primary=true){
 const hov=hit(mouse,{x,y,w,h}),s=1+(primary?Math.sin(runT*4)*.02:0)+(hov?.03:0);
 ctx.save();ctx.translate(x+w/2,y+h/2);ctx.scale(s,s);
 if(primary){const g=ctx.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,BRAND.blue);g.addColorStop(1,BRAND.bright);ctx.fillStyle=g;ctx.shadowColor=BRAND.bright;ctx.shadowBlur=hov?30:18}
 else ctx.fillStyle='rgba(255,255,255,.1)';
 rr(ctx,-w/2,-h/2,w,h,h/2);ctx.fill();ctx.shadowBlur=0;
 if(primary){ctx.save();rr(ctx,-w/2,-h/2,w,h,h/2);ctx.clip();const sx=((runT*.6)%1.6-.3)*w-w/2;ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(sx,-h/2);ctx.lineTo(sx+40,-h/2);ctx.lineTo(sx+10,h/2);ctx.lineTo(sx-30,h/2);ctx.fill();ctx.restore()}
 text(label,0,1,primary?21:15,'#fff','center',900);ctx.restore();
 buttons.push({x,y,w,h,act});
}
function statBox(label,value,x,y,w,h,color='#fff'){
 ctx.fillStyle='rgba(111,163,255,.08)';rr(ctx,x,y,w,h,14);ctx.fill();ctx.strokeStyle='rgba(111,163,255,.2)';ctx.lineWidth=1;ctx.stroke();
 text(label,x+w/2,y+20,10,'#8f9cbc','center',800);text(value,x+w/2,y+h-24,24,color,'center',900);
}
function drawMenu(){
 const bg=ctx.createLinearGradient(W,0,0,H);bg.addColorStop(0,'#2a5bd8');bg.addColorStop(.45,'#0c1d52');bg.addColorStop(1,'#02040c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 for(const s of menuStars){ctx.globalAlpha=.3+.5*(.5+.5*Math.sin(runT*2+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;
 // planet horizon
 ctx.save();ctx.fillStyle='#050b22';ctx.shadowColor='#3f7dff';ctx.shadowBlur=40;ctx.beginPath();ctx.arc(300,H+560,700,0,7);ctx.fill();ctx.restore();
 ctx.strokeStyle='rgba(111,163,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(300,H+560,700,Math.PI*1.2,Math.PI*1.8);ctx.stroke();
 const bob=Math.sin(runT*1.6)*8;
 if(heroCanvas){const hh=560,hw=hh*heroCanvas.width/heroCanvas.height;ctx.drawImage(heroCanvas,40,H-hh-8+bob,hw,hh)}
 else drawDili(290,360+bob,6,1,{carrying:true});
 // orbiting packages around the hero
 for(let i=0;i<3;i++){const a=runT*.8+i*2.1,px=300+Math.cos(a)*230,py=330+Math.sin(a)*60+bob;if(Math.sin(a)<0)ctx.globalAlpha=.5;drawPackage(px,py,1.1+.3*Math.sin(a));ctx.globalAlpha=1}
 const cx=815;
 drawLogo(ctx,cx-62,86,34);text('DLICOM PRESENTS',cx-38,86,13,'#bcd0ff','left',800);
 outlined('DILI',cx,165,92,'#fff');outlined('DELIVERY',cx,232,52,BRAND.sky);
 text('Deliver · Dodge · Combo',cx,274,17,'#bcd0ff','center',700);
 button('START DELIVERY',cx-150,306,300,62,startRun);
 text('PERSONAL BEST',cx,404,11,'#8f9cbc','center',900);
 statBox('SCORE',fmt(best.score),cx-243,420,156,76,'#ffd34d');
 statBox('FASTEST',best.time==null?'—':best.time.toFixed(2)+'s',cx-78,420,156,76);
 statBox('BEST COMBO','x'+best.combo,cx+87,420,156,76,BRAND.sky);
 ZONES.forEach((z,i)=>{const x=cx+(i-2.5)*58,y=528,open=i<=(best.maxZone||0);
  ctx.fillStyle=open?'rgba(111,163,255,.14)':'rgba(255,255,255,.04)';ctx.beginPath();ctx.arc(x,y,21,0,7);ctx.fill();
  ctx.strokeStyle=open?z.accent:'rgba(255,255,255,.12)';ctx.lineWidth=2;ctx.stroke();
  if(open)text(z.icon,x,y+1,19,'#fff','center');else{ctx.globalAlpha=.45;text('🔒',x,y+1,13,'#fff','center');ctx.globalAlpha=1}
  if(i<ZONES.length-1){ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x+23,y-1,12,2)}});
 if(mouse.y>505&&mouse.y<550){const i=Math.round((mouse.x-cx)/58+2.5);if(i>=0&&i<ZONES.length)text(i<=(best.maxZone||0)?ZONES[i].name+' · '+ZONES[i].tag:'Locked — reach it in a run',cx,558,11,'#bcd0ff','center',800)}
 text('📦 Pick up  →  follow the dots  →  🏠 Drop off   ·   Fast x2 · No crash x3',cx,580,13,'#dfe5f0','center',700);
 text('6 zones · trains, ice & meteors · then endless loops',cx,602,13,'#dfe5f0','center',700);
 text(touchUI?'Drag the left side to move · Tap the right side to dash':'WASD / Arrows move · Space dash · P pause · M sound',cx,626,12,'#7d8bab','center',700);
 text((actx?'':'🔊 Sound starts on first key/tap  ·  ')+'Press ENTER or tap to start',cx,H-22,11,'#6b7aa0','center',800);
}
function drawOver(){
 ctx.fillStyle='rgba(6,10,24,.82)';ctx.fillRect(0,0,W,H);
 outlined('SHIFT OVER',W/2,120,58,'#fff');
 outlined(fmt(dispScore),W/2,200,72,'#ffd34d');
 if(newBest){const s=1+Math.sin(runT*6)*.05;ctx.save();ctx.translate(W/2,252);ctx.scale(s,s);ctx.fillStyle='#45e6a5';rr(ctx,-78,-15,156,30,15);ctx.fill();text('★ NEW BEST ★',0,1,14,'#0d2a22','center',900);ctx.restore()}
 const y=286,w=175,gap=14,x0=W/2-(w*4+gap*3)/2;
 statBox('DELIVERIES',String(deliveries),x0,y,w,80);
 statBox('BEST COMBO','x'+runBestCombo,x0+(w+gap),y,w,80,'#ffd34d');
 statBox('FASTEST',fastest==null?'—':fastest.toFixed(2)+'s',x0+(w+gap)*2,y,w,80);
 statBox('DISTANCE',(totalDist/T*10/1000).toFixed(2)+'km',x0+(w+gap)*3,y,w,80);
 text(`Reached ${zone.icon} ${zone.name}${loop?' '+ROMAN[Math.min(loop,9)]:''}`,W/2,386,15,zone.accent,'center',900);
 text(`PERSONAL BEST  ${fmt(best.score)}   ·   FASTEST ${best.time==null?'—':best.time.toFixed(2)+'s'}   ·   COMBO x${best.combo}`,W/2,412,12,'#aab8d5','center',800);
 if(overDelay<=0)button('RUN AGAIN',W/2-130,436,260,60,startRun);
 if(overDelay<=0)button('MENU',W/2-60,512,120,40,()=>{mode='menu'},false);
 drawDili(W/2+300,190+Math.sin(runT*3)*5,2.4,-1,{carrying:false,pop:newBest?(runT%1.2):0});
 text('Enter / Space / Tap to run again',W/2,H-34,12,'#56627f','center',800);
}
function drawUpgrade(){
 ctx.fillStyle='rgba(6,10,24,.8)';ctx.fillRect(0,0,W,H);
 outlined('DELIVERY BONUS',W/2,130,42,BRAND.sky);text('Pick one upgrade  ·  press 1 / 2 / 3 or tap',W/2,172,15,'#aab8d5','center',700);
 const cw=240,ch=250,gap=28,x0=W/2-(cw*3+gap*2)/2,y=210;
 upgradeChoices.forEach((u,i)=>{const x=x0+i*(cw+gap),hov=hit(mouse,{x,y,w:cw,h:ch}),fl=Math.sin(runT*2+i)*4;
  ctx.save();ctx.translate(0,fl);
  ctx.fillStyle=hov?'rgba(111,163,255,.18)':'rgba(255,255,255,.07)';rr(ctx,x,y,cw,ch,18);ctx.fill();
  ctx.strokeStyle=hov?BRAND.sky:'rgba(255,255,255,.15)';ctx.lineWidth=2;ctx.stroke();
  text(u.icon,x+cw/2,y+62,46,'#fff','center');text(u.name,x+cw/2,y+118,22,'#fff','center',900);text(u.desc,x+cw/2,y+146,13,'#aab8d5','center',700);
  if(u.id!=='time'){const n=u.max,lv=upg[u.id],sw=(cw-60-(n-1)*5)/n;for(let j=0;j<n;j++){ctx.fillStyle=j<lv?BRAND.sky:j===lv?'rgba(111,163,255,.45)':'#2c3656';rr(ctx,x+30+j*(sw+5),y+176,sw,10,5);ctx.fill()}}
  ctx.fillStyle='rgba(255,255,255,.1)';rr(ctx,x+cw/2-18,y+204,36,26,8);ctx.fill();text(String(i+1),x+cw/2,y+217.5,14,'#fff','center',900);
  ctx.restore();
  buttons.push({x,y,w:cw,h:ch,act:()=>chooseUpgrade(i)});
 });
}
function drawStage(){
 if(mode!=='stage'||!stageInfo)return;const t=stageT,io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
 const cover=t<.5?io(t/.5):t>2.7?1-io(Math.min(1,(t-2.7)/.5)):1;if(cover<=0)return;
 const z=ZONES[stageInfo.i],g=ctx.createLinearGradient(W,0,0,H);g.addColorStop(0,shade(z.accent,-.35));g.addColorStop(.5,'#0c1d52');g.addColorStop(1,'#02040c');
 ctx.save();ctx.beginPath();
 if(t<=2.7){const e=cover*(W+300);ctx.moveTo(0,0);ctx.lineTo(e,0);ctx.lineTo(e-300,H);ctx.lineTo(0,H)}
 else{const lx=(1-cover)*(W+300);ctx.moveTo(lx,0);ctx.lineTo(W,0);ctx.lineTo(W,H);ctx.lineTo(lx-300,H)}
 ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.clip();
 for(const s of menuStars){ctx.globalAlpha=.25+.4*(.5+.5*Math.sin(runT*3+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
 const a=clamp((t-.45)/.25,0,1)*clamp((2.75-t)/.2,0,1);ctx.globalAlpha=a;
 outlined('✓ '+stageInfo.cleared+' CLEAR!',W/2,108,24,'#45e6a5');text('+8s SHIFT BONUS',W/2,140,14,'#ffd34d','center',900);
 const s=easeOutBack(clamp((t-.6)/.35,0,1));ctx.save();ctx.translate(W/2,235);ctx.scale(s,s);text(z.icon,0,0,72,'#fff','center');ctx.restore();
 text(stageInfo.i===ZONES.length-1&&stageInfo.loop?`FINAL ZONE · LOOP ${stageInfo.loop+1}`:`ZONE ${stageInfo.i+1} / ${ZONES.length}`,W/2,305,13,'#bcd0ff','center',900);
 outlined(z.name+(stageInfo.loop?' '+ROMAN[Math.min(stageInfo.loop,9)]:''),W/2+(1-clamp((t-.7)/.3,0,1))*120,352,58,z.accent);
 text('DIFFICULTY · '+z.tag+(stageInfo.loop?`  ·  SPEED +${stageInfo.loop*15}%`:''),W/2,398,14,'#dfe5f0','center',800);
 ctx.font=font(17,800);const tw=ctx.measureText(z.tip).width+40;ctx.fillStyle='rgba(255,255,255,.08)';rr(ctx,W/2-tw/2,424,tw,40,20);ctx.fill();text(z.tip,W/2,444.5,17,'#fff','center',800);
 if(stageInfo.unlocked){const p=1+Math.sin(runT*6)*.05;ctx.save();ctx.translate(W/2,494);ctx.scale(p,p);ctx.fillStyle=z.accent;rr(ctx,-100,-14,200,28,14);ctx.fill();text('★ NEW ZONE UNLOCKED ★',0,1,12,'#0a1330','center',900);ctx.restore()}
 const dxp=-60+clamp((t-.5)/2.2,0,1)*(W+120);drawDili(dxp,590,2.2,1,{moving:true,carrying:true});
 if(t>1.2)text('Enter / Tap to continue',W/2,H-24,12,'#6b7aa0','center',800);
 ctx.restore();
 ctx.fillStyle=z.accent;ctx.globalAlpha=.9;
 if(t<=2.7){const e=cover*(W+300);ctx.beginPath();ctx.moveTo(e,0);ctx.lineTo(e+8,0);ctx.lineTo(e-292,H);ctx.lineTo(e-300,H);ctx.fill()}
 ctx.globalAlpha=1;
}
function drawPaused(){
 ctx.fillStyle='rgba(6,10,24,.7)';ctx.fillRect(0,0,W,H);outlined('PAUSED',W/2,H/2-30,56,'#fff');
 text('Press P or tap to resume',W/2,H/2+22,15,'#aab8d5','center',700);
 button('MENU',W/2-60,H/2+60,120,40,()=>{mode='menu'},false);
}
function draw(){
 buttons=[];
 if(mode==='menu'){drawMenu();return}
 ctx.save();
 if(shake>0)ctx.translate(rand(-6,6)*shake/.3,rand(-6,6)*shake/.3);
 drawWorld();ctx.restore();
 drawVignette();drawResultCard();drawBanner();drawHype();drawTutorial();drawTouch();
 drawHUD();drawCoins();
 if(flash>0){ctx.globalAlpha=Math.min(.45,flash);ctx.fillStyle=flashColor;ctx.fillRect(0,HUD,W,ROWS*T);ctx.globalAlpha=1}
 drawStage();
 if(mode==='over')drawOver();else if(mode==='upgrade')drawUpgrade();else if(mode==='paused')drawPaused();
 if(mode==='over'){for(const p of particles)if(!p.dust){ctx.globalAlpha=Math.max(0,p.t/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size*.6)}ctx.globalAlpha=1}
}

// ---------- boot ----------
genMap({c:12,r:6});spawnCars();
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
